name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Kiểm thử Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  e2e:
    name: Kiểm thử trình duyệt (camera giả)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Chạy 4 kịch bản chụp
        run: npm run test:e2e
        env:
          # Máy CI dùng một lần, tắt sandbox để Chrome headless chạy được trên Ubuntu mới.
          CHROME_FLAGS: --no-sandbox
      - name: Lưu ảnh chụp màn hình khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            .e2e-out/**/*.png
          if-no-files-found: ignore
